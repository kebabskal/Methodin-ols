name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # publish job creates/updates the "nightly" release

jobs:
  # ols must be built with Methodin (not official Odin) — the compiler comes
  # prebuilt from kebabskal/Methodin's rolling "latest" release. ci.sh/ci.bat
  # expect it in ./Odin on PATH.
  dist-x86_64-unknown-linux-gnu:
    runs-on: ubuntu-22.04 # matches the Methodin artifact's glibc/LLVM
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download Methodin
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir Odin
        gh release download latest -R kebabskal/Methodin \
          -p "methodin-linux-amd64.tar.gz" -O - | tar -xz -C Odin
    - name: Install LLVM runtime
      # the prebuilt odin binary links libLLVM-20 dynamically
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libllvm20
    - name: Build ols
      run: ./ci.sh CI
    - name: Move to Dist
      run: |
        mkdir dist
        mv ols dist/ols-x86_64-unknown-linux-gnu
        mv odinfmt dist/odinfmt-x86_64-unknown-linux-gnu
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-x86_64-unknown-linux-gnu
        path: ./dist

  dist-arm64-darwin:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download Methodin
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir Odin
        gh release download latest -R kebabskal/Methodin \
          -p "methodin-macos-arm64.tar.gz" -O - | tar -xz -C Odin
    - name: Install LLVM runtime
      run: brew list llvm@20 &>/dev/null || brew install llvm@20
    - name: Build ols
      run: ./ci.sh CI
    - name: Move to Dist
      run: |
        mkdir dist
        mv ols dist/ols-arm64-darwin
        mv odinfmt dist/odinfmt-arm64-darwin
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-arm64-darwin
        path: ./dist

  dist-x86_64-darwin:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download Methodin
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir Odin
        gh release download latest -R kebabskal/Methodin \
          -p "methodin-macos-amd64.tar.gz" -O - | tar -xz -C Odin
    - name: Install LLVM runtime
      run: brew list llvm@20 &>/dev/null || brew install llvm@20
    - name: Build ols
      run: ./ci.sh CI
    - name: Move to Dist
      run: |
        mkdir dist
        mv ols dist/ols-x86_64-darwin
        mv odinfmt dist/odinfmt-x86_64-darwin
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-x86_64-darwin
        path: ./dist

  dist-arm64-unknown-linux-gnu:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download Methodin
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir Odin
        gh release download latest -R kebabskal/Methodin \
          -p "methodin-linux-arm64.tar.gz" -O - | tar -xz -C Odin
    - name: Install LLVM runtime
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libllvm20
    - name: Build ols
      run: ./ci.sh CI
    - name: Move to Dist
      run: |
        mkdir dist
        mv ols dist/ols-arm64-unknown-linux-gnu
        mv odinfmt dist/odinfmt-arm64-unknown-linux-gnu
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-arm64-unknown-linux-gnu
        path: ./dist

  dist-x86_64-pc-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download Methodin
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      # LLVM-C.dll ships inside the archive next to odin.exe
      run: |
        mkdir Odin
        gh release download latest -R kebabskal/Methodin \
          -p "methodin-windows-amd64.tar.gz" -O - | tar -xz -C Odin
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build ols
      shell: cmd
      run: ci.bat CI
    - name: Move to Dist
      shell: cmd
      run: |
        mkdir dist
        move ols.exe dist/
        move odinfmt.exe dist/
        move builtin dist/
        cd dist
        ren ols.exe ols-x86_64-pc-windows-msvc.exe
        ren odinfmt.exe odinfmt-x86_64-pc-windows-msvc.exe
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-x86_64-pc-windows-msvc
        path: ./dist

  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Package VS Code extension
      run: |
        cd editors/vscode
        npm ci
        npm run build
        mv extension.vsix methodin-ols.vsix
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: editors/vscode/methodin-ols.vsix

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ['dist-x86_64-pc-windows-msvc', 'dist-x86_64-unknown-linux-gnu', 'dist-arm64-unknown-linux-gnu', 'dist-x86_64-darwin', 'dist-arm64-darwin', 'vsix']
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # the github-release action reads HEAD_SHA to point the nightly tag
    - run: echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - uses: actions/download-artifact@v4
      with:
        name: dist-x86_64-unknown-linux-gnu
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: dist-x86_64-pc-windows-msvc
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: dist-arm64-darwin
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: dist-x86_64-darwin
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: dist-arm64-unknown-linux-gnu
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: vsix
        path: dist

    # Zip names must stay `ols-<platform>.zip` — the VS Code extension's
    # auto-download looks assets up by exactly these names.
    - run: |
        ls -al ./dist
        cd dist
        zip -r ols-x86_64-pc-windows-msvc.zip ols-x86_64-pc-windows-msvc.exe odinfmt-x86_64-pc-windows-msvc.exe builtin
        rm ols-x86_64-pc-windows-msvc.exe odinfmt-x86_64-pc-windows-msvc.exe

        chmod +x ols-x86_64-unknown-linux-gnu odinfmt-x86_64-unknown-linux-gnu
        zip -r ols-x86_64-unknown-linux-gnu.zip ols-x86_64-unknown-linux-gnu odinfmt-x86_64-unknown-linux-gnu builtin
        rm ols-x86_64-unknown-linux-gnu odinfmt-x86_64-unknown-linux-gnu

        chmod +x ols-arm64-darwin odinfmt-arm64-darwin
        zip -r ols-arm64-darwin.zip ols-arm64-darwin odinfmt-arm64-darwin builtin
        rm ols-arm64-darwin odinfmt-arm64-darwin

        chmod +x ols-x86_64-darwin odinfmt-x86_64-darwin
        zip -r ols-x86_64-darwin.zip ols-x86_64-darwin odinfmt-x86_64-darwin builtin
        rm ols-x86_64-darwin odinfmt-x86_64-darwin

        chmod +x ols-arm64-unknown-linux-gnu odinfmt-arm64-unknown-linux-gnu
        zip -r ols-arm64-unknown-linux-gnu.zip ols-arm64-unknown-linux-gnu odinfmt-arm64-unknown-linux-gnu builtin
        rm ols-arm64-unknown-linux-gnu odinfmt-arm64-unknown-linux-gnu

        rm -rf builtin

    - name: Publish Release
      uses: ./.github/actions/github-release
      with:
        files: "dist/*"
        name: nightly
        token: ${{ secrets.GITHUB_TOKEN }}
